# Firebase Hosting deployment disabled
# This project uses Vercel for deployment instead
# Vercel supports Next.js server-side features (API routes, SSR)
# that Firebase Hosting (static only) does not support

name: Deploy to Firebase Hosting on merge (DISABLED)
'on':
  workflow_dispatch:  # Manual trigger only, not on push
jobs:
  build_and_deploy:
    if: false  # Disabled - using Vercel instead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
